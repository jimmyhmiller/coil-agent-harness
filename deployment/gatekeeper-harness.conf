[Service]
Environment="HARNESS_JOURNAL_PATH=/var/lib/gatekeeper/harness.jsonl"
Environment="HARNESS_WORKSPACE_PATH=/var/lib/gatekeeper/harness-workspace"
Environment="HARNESS_CONFIG_DIR=/var/lib/gatekeeper/harness-config"
Environment="HARNESS_WORKFLOW_ROOT=/var/lib/gatekeeper/harness-workflows"
Environment="HARNESS_FACTORY_STATE_ROOT=/var/lib/gatekeeper/harness-factory"
Environment="HARNESS_BIN=/usr/local/bin/coil-agent-harness"
Environment="HARNESS_FACTORY_LAUNCHER=/usr/local/libexec/coil-agent-harness/launch_factory_service.sh"
Environment="HARNESS_FACTORY_RUNNER=/usr/local/libexec/coil-agent-harness/run_factory_service.sh"
Environment="HARNESS_TOOL_GROUPS=filesystem,bash,orchestration"
