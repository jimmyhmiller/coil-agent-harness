[package]
name = "snake"
entry = "src/main.coil"
source-roots = ["src", "tests"]

[cc]
sources = ["native/snake_window.c"]
include-dirs = ["native"]
flags = ["-std=c11", "-Wall", "-Wextra"]

[link]
libs = ["SDL2"]
search-paths = ["/opt/homebrew/lib"]

[test]
roots = ["tests"]
suffixes = ["_test.coil"]
